[env:rp2040zero]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2040_zero
framework = arduino
board_build.core = earlephilhower

; USB stack must be TinyUSB for USB-MIDI
; The Arduino glue layer include path is REQUIRED for the Adafruit TinyUSB
; library to register devices with the earlephilhower core. Without it,
; -DUSE_TINYUSB compiles but the USB device never enumerates as MIDI.
build_flags =
    -DUSE_TINYUSB
    "-I$PROJECT_PACKAGES_DIR/framework-arduinopico/libraries/Adafruit_TinyUSB_Arduino/src/arduino"

; Libraries
; Note: NOT pulling Adafruit TinyUSB from registry - the earlephilhower core
; bundles its own version that matches the include path above. Pulling a separate
; copy creates two versions and breaks USB enumeration.
lib_deps =
    fortyseveneffects/MIDI Library@^5.0.2
    adafruit/Adafruit NeoPixel@^1.12.0

; Ignore SdFat issues (not needed for MIDI)
lib_ignore = SdFat - Adafruit Fork

; Upload method
upload_protocol = picotool

; Monitor
monitor_speed = 115200
